name: Public enquiry regression
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/lib/catalog/**'
      - 'src/lib/slug/**'
      - 'scripts/test-*.mjs'
      - src/components/forms/LeadForm.tsx
      - scripts/test-lead-form-browser.mjs
      - scripts/test-lead-form-handlers.mjs
      - .github/workflows/quote-form-recovery.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: validation-only
          MYSQL_DATABASE: fixpoint_validation
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:validation-only@127.0.0.1:3306/fixpoint_validation
      NEXT_PUBLIC_SITE_URL: https://fixpoint.ae
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/quote-browser" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          echo "NODE_PATH=$RUNNER_TEMP/quote-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/quote-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: npx tsc --noEmit
      - name: Lint changed public source
        run: |
          npx eslint src/components/forms/LeadForm.tsx src/lib/catalog/category-child-copy.ts src/lib/slug/locale-directory-query.ts 'src/app/[locale]/[service]/page.tsx' 'src/app/[locale]/contact/page.tsx' 'src/app/[locale]/diy/[slug]/page.tsx' 'src/app/[locale]/get-a-quote/page.tsx' 'src/app/[locale]/locations/[location]/page.tsx' 'src/app/[locale]/services/[category]/page.tsx'
      - name: Reproduce the original reset
        env:
          # Fixed historical baseline: the PR base already contains the repair after #98.
          BASE_SHA: 8437bb6657ed38317a6d919b5a3d4df64b12e45c
        run: |
          cp src/components/forms/LeadForm.tsx /tmp/LeadForm.fixed.tsx
          trap 'cp /tmp/LeadForm.fixed.tsx src/components/forms/LeadForm.tsx' EXIT
          git show "$BASE_SHA:src/components/forms/LeadForm.tsx" > src/components/forms/LeadForm.tsx
          if node scripts/test-lead-form-browser.mjs > /tmp/quote-baseline.log 2>&1; then
            echo 'Expected the original form to fail preservation.'
            exit 1
          fi
          cat /tmp/quote-baseline.log
          grep 'entered fields must survive' /tmp/quote-baseline.log
      - name: Verify fixed English and Arabic forms
        run: node scripts/test-lead-form-browser.mjs
      - name: Verify catalogue, navigation, metadata and enquiry regressions
        run: |
          for test in scripts/test-*-card-identities.mjs scripts/test-category-pagination.mjs scripts/test-locale-directory-query.mjs scripts/test-diy-related-service-card.mjs scripts/test-diy-guide-metadata-alternates.mjs scripts/test-diy-category-metadata-alternates.mjs scripts/test-contact-service-search.mjs scripts/test-booking-service-search.mjs scripts/test-faq-quote-context.mjs scripts/test-lead-form-handlers.mjs; do
            node --import tsx "$test" || exit 1
          done
      - name: Create isolated build database
        run: npx prisma db push --skip-generate
      - name: Compile production application
        run: npm run build
