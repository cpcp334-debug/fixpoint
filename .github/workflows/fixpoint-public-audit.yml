name: Fixpoint public SEO snapshot
on:
  push:
    branches: [draft/blog-locale-catalog-20261101]
    paths:
      - scripts/fixpoint-public-audit.mjs
      - .github/workflows/fixpoint-public-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fixpoint-public-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fixpoint-public-snapshot
          path: fixpoint-public-snapshot.json
          retention-days: 7
